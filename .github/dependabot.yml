version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    # The security workflow rescans the released image every day at 09:17 UTC,
    # and any fixable finding fails it. Check every day, ahead of that scan, so
    # a module security fix arrives as a PR rather than as a red scan. The
    # "daily" interval skips weekends, hence cron.
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Etc/UTC"
    # Version updates otherwise wait out a default three-day cooldown, which
    # would hold a Thursday security fix until the following week. Waive it only
    # for the golang.org/x modules; direct dependencies keep the cooldown.
    cooldown:
      exclude:
        - "golang.org/x/*"
    # Keep core Go changes individually reviewable; ExternalDNS updates can
    # alter provider behavior and should not be hidden inside a broad bundle.
    open-pull-requests-limit: 3
    allow:
      - dependency-type: "direct"
      # golang.org/x/net and its siblings are indirect requirements here but
      # are linked into the binary, and Dependabot skips indirect modules
      # unless they are allowed by name.
      - dependency-name: "golang.org/x/*"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  # Keep the wrapper aligned with supported ExternalDNS chart releases. Only the
  # chart dependency is managed here: both image tags in values.yaml are set by
  # the release process (the controller is pinned by digest after its rendered
  # arguments are verified), and looking them up fails the whole job because
  # Dependabot doubles the registry host in the registry.k8s.io request path.
  - package-ecosystem: "helm"
    directory: "/charts/external-dns-porkbun-webhook"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "external-dns"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  # The golang builder carries the Go toolchain and the distroless base carries
  # the runtime's OS packages, so both need the same cadence as the modules,
  # without the default cooldown. A golang bump must also move the go.mod
  # toolchain line; scripts/verify-go-version.sh fails CI until it does.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 5 * * *"
      timezone: "Etc/UTC"
    cooldown:
      exclude:
        - "*"
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns:
          - "*"
