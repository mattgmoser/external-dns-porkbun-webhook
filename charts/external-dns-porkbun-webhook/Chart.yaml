annotations:
  artifacthub.io/category: networking
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/mattgmoser/external-dns-porkbun-webhook
    - name: external-dns
      url: https://github.com/kubernetes-sigs/external-dns
