  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Moved the bundled ExternalDNS controller to v0.24.0, pinned by digest, clearing 19 of the 22 fixable findings the v0.23.0 image now carries, including all 5 HIGH Go standard library and golang.org/x/net findings; the 4 that remain (three Debian 12 base advisories and golang.org/x/crypto/openpgp) have no severity assigned
    - kind: security
      description: Rebuilt the webhook on Go 1.27.3 and a patched distroless base, clearing CVE-2026-111943 (HIGH, Go standard library) and DSA-6572-1 (ca-certificates) from the 0.6.1 image
    - kind: changed
      description: Updated to ExternalDNS v0.24.0 on the official chart 1.23.0, and ran every rendered argument through the v0.24.0 binary; the webhook provider protocol is unchanged
    - kind: changed
      description: ExternalDNS v0.24.0 drops endpoints without targets; with the crd source and policy sync, an emptied DNSEndpoint now deletes its record instead of stopping the controller
  artifacthub.io/images: |
    - name: external-dns
      image: registry.k8s.io/external-dns/external-dns:v0.24.0
