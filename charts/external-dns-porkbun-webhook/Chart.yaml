  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: Pinned the bundled ExternalDNS controller to v0.23.0 by digest, clearing the fixable findings the v0.22.0 image now carries, including CVE-2026-84445 (HIGH, google.golang.org/grpc) and CVE-2026-56855 and CVE-2026-78662 (golang.org/x/crypto)
    - kind: changed
      description: Updated to ExternalDNS v0.23.0 and the official chart 1.22.0, and verified every rendered argument against the v0.23.0 binary
    - kind: fixed
      description: Ownership TXT records whose stored value differs from their re-serialized labels are now deleted and updated in place instead of being orphaned or duplicated, through ExternalDNS v0.23's stored-value deletes
    - kind: changed
      description: Rebuilt the webhook on Go 1.27.1, which ExternalDNS v0.23.0 requires
  artifacthub.io/images: |
    - name: external-dns
      image: registry.k8s.io/external-dns/external-dns:v0.23.0
    - name: porkbun-webhook
      image: ghcr.io/mattgmoser/external-dns-porkbun-webhook:0.6.0
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/recommendations: |
