{{- $externalDNS := index .Values "external-dns" | default dict -}}
{{- $provider := index $externalDNS "provider" | default dict -}}
{{- $providerName := index $provider "name" | default "" | trim -}}
{{- if ne $providerName "webhook" -}}
{{- fail "external-dns.provider.name must remain webhook; changing it removes the Porkbun sidecar from this chart" -}}
{{- end -}}
{{- $webhook := index $provider "webhook" | default dict -}}
{{- $env := index $webhook "env" | default list -}}
{{- $porkbunDomain := "" -}}
{{- $webhookDomainFilter := "" -}}
{{- $webhookListen := "" -}}
{{- $opsListen := "" -}}
{{- $webhookListenCount := 0 -}}
{{- $opsListenCount := 0 -}}
{{- range $entry := $env -}}
  {{- if eq ($entry.name | default "") "PORKBUN_DOMAIN" -}}
    {{- $porkbunDomain = $entry.value | default "" -}}
  {{- else if eq ($entry.name | default "") "DOMAIN_FILTER" -}}
    {{- $webhookDomainFilter = $entry.value | default "" -}}
  {{- else if eq ($entry.name | default "") "WEBHOOK_LISTEN" -}}
    {{- $webhookListen = $entry.value | default "" | trim -}}
    {{- $webhookListenCount = add1 $webhookListenCount -}}
  {{- else if eq ($entry.name | default "") "OPS_LISTEN" -}}
    {{- $opsListen = $entry.value | default "" | trim -}}
    {{- $opsListenCount = add1 $opsListenCount -}}
  {{- end -}}
{{- end -}}
{{- $porkbunDomain = trimSuffix "." (lower (trim $porkbunDomain)) -}}
{{- $webhookDomainFilter = trimSuffix "." (lower (trim $webhookDomainFilter)) -}}
{{- if or (empty $porkbunDomain) (eq $porkbunDomain "example.com") -}}
{{- fail "set external-dns.provider.webhook.env PORKBUN_DOMAIN to the Porkbun apex zone; the example value is not installable" -}}
{{- end -}}
{{- if or (empty $webhookDomainFilter) (eq $webhookDomainFilter "example.com") -}}
{{- fail "set external-dns.provider.webhook.env DOMAIN_FILTER to the intended webhook scope; the example value is not installable" -}}
{{- end -}}
{{- if or (ne $webhookListenCount 1) (ne $webhookListen "127.0.0.1:8888") -}}
{{- fail "external-dns.provider.webhook.env must contain exactly one WEBHOOK_LISTEN=127.0.0.1:8888; the unauthenticated mutation endpoint must remain loopback-only" -}}
{{- end -}}
{{- if or (ne $opsListenCount 1) (ne $opsListen ":8080") -}}
{{- fail "external-dns.provider.webhook.env must contain exactly one OPS_LISTEN=:8080 so the Service exposes only health and metrics" -}}
{{- end -}}
{{- $extraArgs := index $externalDNS "extraArgs" | default dict -}}
{{- $providerURL := index $extraArgs "webhook-provider-url" | default "" | trim -}}
{{- if ne $providerURL "http://127.0.0.1:8888" -}}
{{- fail "external-dns.extraArgs.webhook-provider-url must be http://127.0.0.1:8888 so ExternalDNS reaches only the same-Pod provider listener" -}}
{{- end -}}
{{- $wildcardReplacement := index $extraArgs "txt-wildcard-replacement" | default "" | trim -}}
{{- if not (regexMatch "^([A-Za-z0-9_]|[A-Za-z0-9_][A-Za-z0-9_-]{0,61}[A-Za-z0-9_])$" $wildcardReplacement) -}}
{{- fail "external-dns.extraArgs.txt-wildcard-replacement must be one valid 1-63 character DNS label so wildcard ownership TXT records remain valid" -}}
{{- end -}}
{{- $domainFilters := index $externalDNS "domainFilters" | default list -}}
{{- if empty $domainFilters -}}
{{- fail "set external-dns.domainFilters to the DNS names this controller may manage" -}}
{{- end -}}
{{- range $domainFilter := $domainFilters -}}
  {{- $normalizedDomainFilter := trimSuffix "." (lower (trim $domainFilter)) -}}
  {{- if empty $normalizedDomainFilter -}}
    {{- fail "external-dns.domainFilters entries must not be empty" -}}
  {{- end -}}
  {{- if eq $normalizedDomainFilter "example.com" -}}
    {{- fail "replace example.com in external-dns.domainFilters before installing" -}}
  {{- end -}}
{{- end -}}
{{- $txtOwnerID := index $externalDNS "txtOwnerId" | default "" | trim -}}
{{- if or (empty $txtOwnerID) (eq (lower $txtOwnerID) "change-me") -}}
{{- fail "set external-dns.txtOwnerId to a stable value unique to this controller; change-me is not installable" -}}
{{- end -}}
{{- /*
Validate the raw value. The dependency renders this verbatim, so trimming here
would let " external-dns.alpha.kubernetes.io/" pass while the controller looks
for annotation keys that begin with a space. ExternalDNS only requires a
trailing /, so it would accept that silently, every annotation-derived endpoint
would vanish from the desired set, and policy=sync would delete the records.

Any DNS-subdomain prefix is allowed, not just the two upstream spellings: a
split-horizon release may legitimately run a custom prefix, and forcing it onto
one of ours would hide its annotations and cause the very deletion this guards.
*/ -}}
{{- $annotationPrefix := index $externalDNS "annotationPrefix" | default "" -}}
{{- if not (kindIs "string" $annotationPrefix) -}}
{{- fail (printf "external-dns.annotationPrefix must be a string, got %s" (kindOf $annotationPrefix)) -}}
{{- end -}}
{{- if empty $annotationPrefix -}}
{{- fail "set external-dns.annotationPrefix explicitly; ExternalDNS 0.22 removed the annotation-prefix fallback, so an unset value silently changes which annotations are honoured. Use external-dns.alpha.kubernetes.io/ to preserve existing behaviour, or external-dns.kubernetes.io/ once annotations are migrated" -}}
{{- end -}}
{{- if ne $annotationPrefix (trim $annotationPrefix) -}}
{{- fail (printf "external-dns.annotationPrefix %q has surrounding whitespace; it is passed to the controller verbatim, so the prefix would never match a real annotation key" $annotationPrefix) -}}
{{- end -}}
{{- if not (hasSuffix "/" $annotationPrefix) -}}
{{- fail (printf "external-dns.annotationPrefix %q must end with / so it concatenates onto annotation names correctly" $annotationPrefix) -}}
{{- end -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/$" $annotationPrefix) -}}
{{- fail (printf "external-dns.annotationPrefix %q must be a DNS subdomain followed by / (for example external-dns.alpha.kubernetes.io/)" $annotationPrefix) -}}
{{- end -}}
{{- $policy := index $externalDNS "policy" | default "" | trim -}}
{{- if empty $policy -}}
{{- fail "set external-dns.policy explicitly; ExternalDNS 0.22 removed the default and requires the flag" -}}
{{- end -}}
{{- /*
The dependency chart is 1.22.0, whose appVersion is the ExternalDNS 0.22.0
image. That image now carries fixable findings, including a HIGH, and the
subchart falls back to it whenever this tag is empty. A coalesced values dump
reintroduces `image.tag: null`, so an upgrade could silently downgrade the
controller to a known-vulnerable runtime with no warning. Require an exact
digest instead.
*/ -}}
{{- $controllerImage := index $externalDNS "image" | default dict -}}
{{- $controllerRepo := index $controllerImage "repository" | default "" -}}
{{- $controllerTag := index $controllerImage "tag" | default "" -}}
{{- if ne $controllerRepo "registry.k8s.io/external-dns/external-dns" -}}
{{- fail (printf "external-dns.image.repository must remain registry.k8s.io/external-dns/external-dns, got %q" $controllerRepo) -}}
{{- end -}}
{{- if not (regexMatch "^v[0-9]+\\.[0-9]+\\.[0-9]+@sha256:[0-9a-f]{64}$" $controllerTag) -}}
{{- fail (printf "external-dns.image.tag must pin the ExternalDNS controller to an exact digest (vMAJOR.MINOR.PATCH@sha256:...); got %q. An empty or floating tag silently falls back to the dependency chart's 0.22.0 image, which has fixable vulnerabilities" $controllerTag) -}}
{{- end -}}
